[package]
name = "ardrec-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Base del ejecutor técnico ARDREC / ARDREC technical executor baseline"
readme = "README.md"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = "=1.0.228"
serde_json = { version = "=1.0.145", features = ["raw_value"] }
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["net", "process"] }
