name: Base de desarrollo / Development baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  python:
    name: Python - empaquetado / packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener código / Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar Python / Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
          architecture: x64

      - name: Preparar uv / Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Verificar empaquetado / Verify packaging
        run: python scripts/verificar_ci.py python
      - name: Descubrir y ejecutar R50-A R51 / Discover and run R50-A R51
        run: |
          PYTHONPATH=src python3 -B - <<'PY'
          import unittest
          checks = [('test_p14_r50a*.py', 41, 'R50A'),
                    ('test_p14_r51*.py', 35, 'R51')]
          for pattern, minimum, label in checks:
              suite = unittest.defaultTestLoader.discover('lab/tests', pattern=pattern)
              count = suite.countTestCases()
              print(f'{label}_DISCOVERED={count}', flush=True)
              if count < minimum:
                  raise SystemExit(f'{label}_DISCOVERY_INSUFFICIENT:{count}<{minimum}')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful():
                  raise SystemExit(f'{label}_TEST_FAILURE')
          PY

      - name: Contrastar fichas DEV R51 / Validate R51 DEV manifests
        run: python3 -B lab/verify_p14_r51_dev_contract.py

      - name: Probar guardia de transicion R55.3 / Test R55.3 transition guard
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p 'test_p14_r553*.py' -v

      - name: Probar temporizador independiente sintetico R55.4 / Test R55.4 independent timer contract
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p 'test_p14_r554*.py' -v

      - name: Probar restaurador deny-only R55.5 / Test R55.5 root recovery without host writes
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p 'test_p14_r555*.py' -v

      - name: Probar instalacion root deny-only R55.6 / Test R55.6 no-host staging contract
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p 'test_p14_r556*.py' -v

      - name: Probar recuperador v2 con binding ausente R55.8 / Test R55.8 partial binding recovery
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p 'test_p14_r558*.py' -v

      - name: Probar programa conjunto SSH FTPS SMB R56.0 / Test R56.0 three-service closure contract
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p 'test_p14_r560*.py' -v

      - name: Probar interfaz y candidata FTP R58-A / Test read-only FTP NIC and candidate
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p 'test_p14_r58a_ftp_*.py' -v

      - name: Probar auditoria F11-P R58-A / Test read-only boot readiness
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p 'test_p14_r58a_f11p_*.py' -v

