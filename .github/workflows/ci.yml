name: Base de desarrollo / Development baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  python:
    name: Python - empaquetado / packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener código / Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar Python / Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
          architecture: x64

      - name: Preparar uv / Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Verificar empaquetado / Verify packaging
        run: python scripts/verificar_ci.py python
      - name: Descubrir y ejecutar R50-A R51 / Discover and run R50-A R51
        run: |
          PYTHONPATH=src python3 -B - <<'PY'
          import unittest
          checks = [('test_p14_r50a*.py', 41, 'R50A'),
                    ('test_p14_r51*.py', 35, 'R51')]
          for pattern, minimum, label in checks:
              suite = unittest.defaultTestLoader.discover('lab/tests', pattern=pattern)
              count = suite.countTestCases()
              print(f'{label}_DISCOVERED={count}', flush=True)
              if count < minimum:
                  raise SystemExit(f'{label}_DISCOVERY_INSUFFICIENT:{count}<{minimum}')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful():
                  raise SystemExit(f'{label}_TEST_FAILURE')
          PY

      - name: R205 prospective attempt journal
        run: |
          PYTHONPATH=src python3 -B - <<'PYR205'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              'lab/tests',
              pattern='test_r205_prospective_attempt_journal.py',
          )
          if suite.countTestCases() != 9:
              raise SystemExit('R205_DISCOVERY_INVALID')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('R205_REGRESSION_FAILED')
          PYR205

      - name: R204 functional SSH and SMB fixtures
        run: |
          PYTHONPATH=src python3 -B - <<'PYR204'
