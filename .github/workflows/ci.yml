name: Base de desarrollo / Development baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  python:
    name: Python - empaquetado / packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código / Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar Python / Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
          architecture: x64

      - name: Preparar uv / Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Verificar empaquetado / Verify packaging
        run: python scripts/verificar_ci.py python
      - name: Verificar trazabilidad vigente / Verify current traceability
        run: python3 scripts/verificar_trazabilidad_actual.py

      - name: Verificar diseño del laboratorio / Verify laboratory design
        run: python3 lab/verify_design.py

      - name: Verificar registro de servicios / Verify service record
        run: python3 lab/verify_services.py

      - name: Probar registro de laboratorio / Test laboratory record
        run: python3 -m unittest discover -s lab/tests -p test_service_record.py -v

      - name: Verificar restauración y aislamiento / Verify restoration and isolation record
        run: python3 lab/verify_restoration_isolation.py

      - name: Probar registro del punto 5 / Test point 5 record
        run: python3 -m unittest discover -s lab/tests -p test_restoration_isolation_record.py -v

      - name: Verificar separación lógica de escenarios / Verify logical scenario separation
        run: python3 lab/verify_scenario_separation.py

      - name: Probar separación y procedencia / Test scenario separation and provenance
        run: python3 -m unittest discover -s lab/tests -p test_scenario_separation.py -v

      - name: Verificar catálogo operacional / Verify operational catalogue
        run: python3 lab/verify_operational_catalog.py

      - name: Probar catálogo y derivación sintética / Test catalogue and synthetic derivation
        run: python3 -m unittest discover -s lab/tests -p test_operational_catalog.py -v

      - name: Verificar perfiles P8 bloqueados / Verify P8 blocked profile slots
        run: python3 lab/verify_execution_profiles.py

      - name: Probar perfiles P8 sin ejecución / Test non-executable P8 profile slots
        run: python3 -m unittest discover -s lab/tests -p test_execution_profiles.py -v

      - name: Verificar P8 R3 denegado / Verify deny-only P8 R3 readiness
        run: python3 lab/verify_p8_readiness.py --format markdown > /dev/null

      - name: Probar preparación P8 R3 / Test P8 R3 readiness
        run: python3 -m unittest discover -s lab/tests -p test_p8_readiness.py -v

      - name: Verificar contrato P8 R4 denegado / Verify deny-only P8 R4 contract
        run: python3 lab/verify_p8_binding_contract.py

      - name: Probar vinculaciones P8 R4 / Test P8 R4 semantic contracts
        run: python3 -m unittest discover -s lab/tests -p test_p8_binding_contract.py -v

      - name: Verificar P8 R5 sin despacho / Verify deny-only P8 R5 material contract
        run: python3 lab/verify_p8_material_attestation.py

      - name: Probar observación de materiales P8 R5 / Test P8 R5 synthetic fd material audit
        run: python3 -m unittest discover -s lab/tests -p test_p8_material_attestation.py -v

      - name: Verificar P8 R6 sin autorización / Verify deny-only P8 R6 lifecycle
        run: python3 lab/verify_p8_lifecycle.py

      - name: Probar ciclo de validez P8 R6 / Test P8 R6 synthetic lifecycle
        run: python3 -m unittest discover -s lab/tests -p test_p8_lifecycle.py -v

      - name: Probar diagnóstico P8 R7 / Test P8 R7 deny-only diagnostics
        run: python3 -m unittest discover -s tests/unit -p test_p8_diagnostic.py -v
      - name: Verificar vectores Python P8 R7 / Verify Python P8 R7 fixtures
        run: python3 scripts/verificar_p8_diagnostico.py --python-only

      - name: Verificar frontera sintética P8 R8 / Verify P8 R8 state boundary
        run: python3 scripts/verificar_p8_state_bridge.py

      - name: Probar frontera de estado P8 R8 / Test P8 R8 state boundary
        run: PYTHONPATH=src python3 -m unittest discover -s tests/unit -p test_p8_state_bridge.py -v

      - name: Verificar materiales P8 R9 sin despacho / Verify P8 R9 material inventory
        run: python3 lab/verify_p8_material_inventory.py

      - name: Probar materiales P8 R9 / Test P8 R9 material constraints
        run: python3 -m unittest discover -s lab/tests -p test_p8_material_inventory.py -v

      - name: Verificar contratos P8 R10 sin ejecución / Verify P8 R10 profiles
        run: python3 lab/verify_p8_profile_contracts.py

      - name: Probar contratos P8 R10 / Test P8 R10 symbolic intents
        run: python3 -m unittest discover -s lab/tests -p test_p8_profile_contracts.py -v

      - name: Verificar fuentes documentales P8 R11 / Verify P8 R11 documentation
        run: python3 lab/verify_p8_cli_sources.py

      - name: Probar fuentes P8 R11 / Test P8 R11 source pins
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_sources.py -v

      - name: Verificar fragmentos P8 R12 / Verify P8 R12 bounded excerpts
        run: python3 lab/verify_p8_cli_semantics.py

      - name: Probar semántica P8 R12 / Test P8 R12 deny-only semantics
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_semantics.py -v

      - name: Verificar gramática P8 R13 / Verify P8 R13 symbolic grammar
        run: python3 lab/verify_p8_cli_grammar.py

      - name: Probar gramática P8 R13 / Test P8 R13 deny-only grammar
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_grammar.py -v

      - name: Verificar fuentes completas P8 R14 / Verify full-source anchors
        run: python3 lab/verify_p8_cli_full_sources.py

      - name: Probar anclas P8 R14 / Test P8 R14 deny-only anchors
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_full_sources.py -v

      - name: Verificar matriz P8 R15 / Verify P8 R15 review gates
        run: python3 lab/verify_p8_cli_review_gates.py

      - name: Probar matriz P8 R15 / Test P8 R15 deny-only review gates
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_review_gates.py -v

      - name: Verificar modelo sintético SSH P8 R16 / Verify synthetic SSH model
        run: python3 lab/verify_p8_r16_ssh_precedence.py

      - name: Probar precedencia sintética P8 R16 / Test deny-only precedence
        run: python3 -m unittest discover -s lab/tests -p test_p8_r16_ssh_precedence.py -v

      - name: Auditar brechas de vinculacion material P8 R17 / Verify material closure gap
        run: python3 lab/verify_p8_r17_material_closure.py

      - name: Probar brechas de vinculacion P8 R17 / Test 29-profile material boundary
        run: python3 -m unittest discover -s lab/tests -p test_p8_r17_material_closure.py -v

      - name: Verificar interfaz ELF offline P8 R18 / Verify bounded ELF evidence interface
        run: python3 lab/verify_p8_r18_elf_metadata.py

      - name: Probar lector ELF P8 R18 / Test no-execution ELF metadata parser
        run: python3 -m unittest discover -s lab/tests -p test_p8_r18_elf_metadata.py -v

      - name: Verificar grafo ELF offline P8 R19 / Verify static candidate graph
        run: python3 lab/verify_p8_r19_graph.py

      - name: Probar grafo ELF P8 R19 / Test bounded deny-only graph
        run: python3 -m unittest discover -s lab/tests -p test_p8_r19_graph.py -v

      - name: Verificar candidatos privados Samba P8 R20 / Verify candidate contract
        run: python3 lab/verify_p8_r20_samba_candidate.py

      - name: Probar rutas privadas Samba P8 R20 / Test bounded deny-only candidates
        run: python3 -m unittest discover -s lab/tests -p test_p8_r20_samba_candidate.py -v

      - name: Verificar conciliacion ELF P8 R21 / Verify offline candidate reconciliation
        run: python3 lab/verify_p8_r21_multiarch_reconcile.py

      - name: Probar conciliacion ELF P8 R21 / Test bounded multiarch lookup
        run: python3 -m unittest discover -s lab/tests -p test_p8_r21_multiarch_reconcile.py -v

      - name: Verificar frontera cargador P8 R22 / Verify static ELF loader boundary
        run: python3 lab/verify_p8_r22_loader_boundary.py

      - name: Probar frontera cargador P8 R22 / Test deny-only search path audit
        run: python3 -m unittest discover -s lab/tests -p test_p8_r22_loader_boundary.py -v

      - name: Verificar obligaciones de perfiles P8 R23 / Verify material profile gates
        run: python3 lab/verify_p8_r23_profile_obligations.py

      - name: Probar negacion perfiles P8 R23 / Test deny-only profile ledger
        run: python3 -m unittest discover -s lab/tests -p test_p8_r23_profile_obligations.py -v

      - name: Verificar suficiencia probatoria P8 R24 / Verify proof boundary
        run: python3 lab/verify_p8_r24_capability_proof_boundary.py

      - name: Probar barrera de capacidad P8 R24 / Test deny-only proof boundary
        run: python3 -m unittest discover -s lab/tests -p test_p8_r24_capability_proof_boundary.py -v

      - name: Verificar origen SSH P8 R25 / Verify offline source contract
        run: python3 lab/verify_p8_r25_ssh_source_provenance.py

      - name: Probar captura estatica SSH P8 R25 / Test source-byte audit contract
        run: python3 -m unittest discover -s lab/tests -p test_p8_r25_ssh_source_provenance.py -v

      - name: Verificar grafo Include SSH P8 R26 / Verify bounded SSH Include candidates
        run: python3 lab/verify_p8_r26_ssh_include_graph.py

      - name: Probar grafo sintético SSH P8 R26 / Test synthetic bounded Include graph
        run: python3 -B -m unittest discover -s lab/tests -p test_p8_r26_ssh_include_graph.py -v

      - name: Verificar diseños simbólicos P8 R29 / Verify typed symbolic declarations
        run: python3 -B lab/verify_p8_r29_typed_declaration.py

      - name: Probar declaraciones sin despacho P8 R29 / Test P8 R29 deny-only contracts
        run: python3 -B -m unittest discover -s lab/tests -p test_p8_r29_typed_declaration.py -v

      - name: Verificar oraculos sinteticos P8 R30 / Verify synthetic acceptance oracles
        run: python3 -B lab/verify_p8_r30_synthetic_acceptance.py

      - name: Probar oraculos FTP/SMB P8 R30 / Test FTP SMB deny-only fixtures
        run: python3 -B -m unittest discover -s lab/tests -p test_p8_r30_synthetic_acceptance.py -v

      - name: Verificar 39 anclas reales R31 / Verify authenticated manual source anchors
        run: python3 -B lab/verify_p8_r31_manual_windows.py

      - name: Probar ventanas documentales R31 / Test bounded manual window rules
        run: python3 -B -m unittest discover -s lab/tests -p test_p8_r31_manual_windows.py -v

      - name: Verificar cola de revisión documental R32 / Verify source-bound review queue
        run: python3 -B lab/verify_p8_r32_semantic_triage.py

      - name: Probar cola de revisión R32 / Test deny-only semantic review queue
        run: python3 -B -m unittest discover -s lab/tests -p test_p8_r32_semantic_triage.py -v

      - name: Verificar registro humano documental R33 / Verify deny-only human review ledger
        run: python3 -B lab/verify_p8_r33_human_adjudication.py

      - name: Probar adjudicacion documental R33 / Test human documentary dispositions
        run: python3 -B -m unittest discover -s lab/tests -p test_p8_r33_human_adjudication.py -v

      - name: Verificar navegacion documental R34 / Verify source-bound review navigation
        run: python3 -B lab/verify_p8_r34_review_navigation.py

      - name: Probar consultas R34 sin autoridad / Test read-only review navigation
        run: python3 -B -m unittest discover -s lab/tests -p test_p8_r34_review_navigation.py -v

      - name: Verificar expedientes de fuente R35 / Verify source-bound dossiers
        run: python3 -B lab/verify_p8_r35_source_dossiers.py

      - name: Probar expedientes documentales R35 / Test deny-only R35 dossiers
        run: python3 -B -m unittest discover -s lab/tests -p test_p8_r35_source_dossiers.py -v

      - name: Probar contratos y transporte / Test contracts and transport
        run: PYTHONPATH=src python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Probar recorrido benigno P9-P12 / Test bounded benign pipeline
        run: python3 -B -m unittest discover -s lab/tests -p test_p9_p12_benign_pipeline.py -v

      - name: Verificar inventario Rust P9 R11 / Verify exact R11 Rust inventory
        run: python3 -B -m unittest discover -s lab/tests -p test_p9_r11_rust_inventory.py -v

      - name: Probar frontera de unidad aislada R12 / Test R12 user unit boundary
        run: python3 -B -m unittest discover -s lab/tests -p test_p9_r12_systemd_user_probe.py -v

      - name: Probar puente durable P9-R13 / Test R13 durable handoff
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p9_r13_durable_handoff.py -v

      - name: Probar parada activa P9-R14 / Test R14 active-stop negative gates
        run: python3 -B -m unittest discover -s lab/tests -p test_p9_r14_active_stop_probe.py -v

      - name: Probar puente durable R15 / Test R15 durable active-stop handoff
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p9_r15_durable_stop_handoff.py -v

      - name: Probar nucleo tipado A1-R16 / Test A1 typed rule kernel
        run: python3 -B -m unittest discover -s lab/tests -p test_p14_r16_a1_kernel.py -v

      - name: Demostrar nucleo tipado A1-R16 / Demonstrate A1 rule kernel
        run: python3 -B scripts/demo_p14_r16_a1.py

      - name: Probar prevalidacion A1-A2 R17 / Test R17 rule preflight
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p14_r17_a1_a2_preflight.py -v

      - name: Demostrar prevalidacion A1-A2 R17 / Demonstrate R17 preflight
        run: python3 -B scripts/demo_p14_r17_a1_a2_preflight.py

      - name: Probar estado inicial sintetico A2 R18 / Test R18 initial preview
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p14_r18_a2_initial_preview.py -v

      - name: Demostrar estado inicial A2 R18 / Demonstrate R18 initial state
        run: python3 -B scripts/demo_p14_r18_a2_initial_preview.py

      - name: Probar dependencias locales A2 R19 / Test R19 local dependencies
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p14_r19_a2_dependency_preview.py -v

      - name: Demostrar 54 unidades sinteticas A2 R19 / Demonstrate 54 synthetic units
        run: python3 -B scripts/demo_p14_r19_a2_dependency_preview.py

      - name: Probar controles simbolicos A2 R20 / Test R20 control references
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p14_r20_a2_control_preview.py -v

      - name: Demostrar 54 unidades y 108 controles R20 / Demonstrate R20 control preview
        run: python3 -B scripts/demo_p14_r20_a2_control_preview.py

      - name: Probar ensamblaje A2 R21 / Test R21 integrated A2 preview
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p14_r21_a2_integrated_preview.py -v

      - name: Demostrar contrato integrado de 54 unidades R21 / Demonstrate R21 contract
        run: python3 -B scripts/demo_p14_r21_a2_integrated_preview.py

      - name: Probar diagnóstico trivalente A3 R22 / Test R22 guard diagnosis
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p14_r22_a3_guard_preview.py -v

      - name: Demostrar 54 unidades y guardas trivalentes A3 R22 / Demonstrate R22 diagnostics
        run: python3 -B scripts/demo_p14_r22_a3_guard_preview.py

      - name: Probar candidatos sintéticos A3 R23 / Test R23 candidate order
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p14_r23_a3_candidate_order.py -v

      - name: Demostrar 54 unidades y candidatos A3 R23 / Demonstrate R23 candidate preview
        run: python3 -B scripts/demo_p14_r23_a3_candidate_order.py

      - name: Probar elegibilidad hipotética A3 R24 / Test R24 hypothetical readiness
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p14_r24_a3_readiness_preview.py -v

      - name: Demostrar 54 escenarios hipotéticos A3 R24 / Demonstrate R24 readiness
        run: python3 -B scripts/demo_p14_r24_a3_readiness_preview.py

      - name: Probar conciliación documental A3 R25 / Test R25 documentary reconciliation
        run: PYTHONPATH=src python3 -B -m unittest discover -s lab/tests -p test_p14_r25_a3_documentary_observations.py -v

      - name: Demostrar 54 unidades documentales A3 R25 / Demonstrate R25 documentary observations
        run: python3 -B scripts/demo_p14_r25_a3_documentary_observations.py

      - name: Probar despliegue deny-first inactivo P14 R35 / Test P14 R35 contained inactive deployment
        run: python3 -B -m unittest discover -s lab/tests -p test_p14_r35_inactive_deployment.py -v

      - name: Demostrar recorrido P9-P12 / Exercise benign end-to-end pipeline
        run: |
          state=$(mktemp -d /tmp/ardrec-p9-p12-ci.XXXXXXXX)
          python3 -B scripts/demo_p9_p12_benign.py --state-dir "$state"

  rust:
    name: Rust - compilación / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código / Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar Rust / Set up Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Preparar Python para protocolo / Set up protocol Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - name: Descargar dependencias Rust / Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Verificar compilación / Verify build
        run: python3 scripts/verificar_ci.py rust
      - name: Ejecutar pruebas Rust / Run Rust tests
        run: cargo test --workspace --all-targets --locked --offline
      - name: Probar transporte Python-Rust / Test Python-Rust transport
        run: python3 scripts/verificar_transporte.py

      - name: Contrastar protocolo Python-Rust / Compare Python-Rust protocol
        run: python3 scripts/verificar_protocolo.py

      - name: Verificar diario técnico / Verify technical journal
        run: python3 scripts/verificar_diario_tecnico.py

      - name: Verificar conciliación por socket / Verify socket reconciliation
        run: python3 scripts/verificar_conciliacion_transporte.py

      - name: Verificar magnitudes exactas / Verify exact magnitudes
        run: python3 scripts/verificar_magnitudes.py

      - name: Verificar política temporal / Verify temporal policy
        run: python3 scripts/verificar_tiempos.py

      - name: Verificar identidad del par / Verify peer identity
        run: python3 scripts/verificar_identidad_par.py

      - name: Comparar Python-Rust P8 R7 / Compare P8 R7 deny-only diagnostics
        run: |
          cargo build --locked --offline --package ardrec-executor --example p8_diagnostic_probe
          python3 scripts/verificar_p8_diagnostico.py --probe target/debug/examples/p8_diagnostic_probe

