name: Base de desarrollo / Development baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  python:
    name: Python - empaquetado / packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código / Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar Python / Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
          architecture: x64

      - name: Preparar uv / Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Verificar empaquetado / Verify packaging
        run: python scripts/verificar_ci.py python
      - name: Verificar trazabilidad vigente / Verify current traceability
        run: python3 scripts/verificar_trazabilidad_actual.py

      - name: Verificar diseño del laboratorio / Verify laboratory design
        run: python3 lab/verify_design.py

      - name: Verificar registro de servicios / Verify service record
        run: python3 lab/verify_services.py

      - name: Probar registro de laboratorio / Test laboratory record
        run: python3 -m unittest discover -s lab/tests -p test_service_record.py -v

      - name: Verificar restauración y aislamiento / Verify restoration and isolation record
        run: python3 lab/verify_restoration_isolation.py

      - name: Probar registro del punto 5 / Test point 5 record
        run: python3 -m unittest discover -s lab/tests -p test_restoration_isolation_record.py -v

      - name: Verificar separación lógica de escenarios / Verify logical scenario separation
        run: python3 lab/verify_scenario_separation.py

      - name: Probar separación y procedencia / Test scenario separation and provenance
        run: python3 -m unittest discover -s lab/tests -p test_scenario_separation.py -v

      - name: Verificar catálogo operacional / Verify operational catalogue
        run: python3 lab/verify_operational_catalog.py

      - name: Probar catálogo y derivación sintética / Test catalogue and synthetic derivation
        run: python3 -m unittest discover -s lab/tests -p test_operational_catalog.py -v

      - name: Verificar perfiles P8 bloqueados / Verify P8 blocked profile slots
        run: python3 lab/verify_execution_profiles.py

      - name: Probar perfiles P8 sin ejecución / Test non-executable P8 profile slots
        run: python3 -m unittest discover -s lab/tests -p test_execution_profiles.py -v

      - name: Verificar P8 R3 denegado / Verify deny-only P8 R3 readiness
        run: python3 lab/verify_p8_readiness.py --format markdown > /dev/null

      - name: Probar preparación P8 R3 / Test P8 R3 readiness
        run: python3 -m unittest discover -s lab/tests -p test_p8_readiness.py -v

      - name: Verificar contrato P8 R4 denegado / Verify deny-only P8 R4 contract
        run: python3 lab/verify_p8_binding_contract.py

      - name: Probar vinculaciones P8 R4 / Test P8 R4 semantic contracts
        run: python3 -m unittest discover -s lab/tests -p test_p8_binding_contract.py -v

      - name: Verificar P8 R5 sin despacho / Verify deny-only P8 R5 material contract
        run: python3 lab/verify_p8_material_attestation.py

      - name: Probar observación de materiales P8 R5 / Test P8 R5 synthetic fd material audit
        run: python3 -m unittest discover -s lab/tests -p test_p8_material_attestation.py -v

      - name: Verificar P8 R6 sin autorización / Verify deny-only P8 R6 lifecycle
        run: python3 lab/verify_p8_lifecycle.py

      - name: Probar ciclo de validez P8 R6 / Test P8 R6 synthetic lifecycle
        run: python3 -m unittest discover -s lab/tests -p test_p8_lifecycle.py -v

      - name: Probar diagnóstico P8 R7 / Test P8 R7 deny-only diagnostics
        run: python3 -m unittest discover -s tests/unit -p test_p8_diagnostic.py -v
      - name: Verificar vectores Python P8 R7 / Verify Python P8 R7 fixtures
        run: python3 scripts/verificar_p8_diagnostico.py --python-only

      - name: Verificar frontera sintética P8 R8 / Verify P8 R8 state boundary
        run: python3 scripts/verificar_p8_state_bridge.py

      - name: Probar frontera de estado P8 R8 / Test P8 R8 state boundary
        run: PYTHONPATH=src python3 -m unittest discover -s tests/unit -p test_p8_state_bridge.py -v

      - name: Verificar materiales P8 R9 sin despacho / Verify P8 R9 material inventory
        run: python3 lab/verify_p8_material_inventory.py

      - name: Probar materiales P8 R9 / Test P8 R9 material constraints
        run: python3 -m unittest discover -s lab/tests -p test_p8_material_inventory.py -v

      - name: Verificar contratos P8 R10 sin ejecución / Verify P8 R10 profiles
        run: python3 lab/verify_p8_profile_contracts.py

      - name: Probar contratos P8 R10 / Test P8 R10 symbolic intents
        run: python3 -m unittest discover -s lab/tests -p test_p8_profile_contracts.py -v

      - name: Verificar fuentes documentales P8 R11 / Verify P8 R11 documentation
        run: python3 lab/verify_p8_cli_sources.py

      - name: Probar fuentes P8 R11 / Test P8 R11 source pins
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_sources.py -v

      - name: Verificar fragmentos P8 R12 / Verify P8 R12 bounded excerpts
        run: python3 lab/verify_p8_cli_semantics.py

      - name: Probar semántica P8 R12 / Test P8 R12 deny-only semantics
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_semantics.py -v

      - name: Verificar gramática P8 R13 / Verify P8 R13 symbolic grammar
        run: python3 lab/verify_p8_cli_grammar.py

      - name: Probar gramática P8 R13 / Test P8 R13 deny-only grammar
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_grammar.py -v

      - name: Verificar fuentes completas P8 R14 / Verify full-source anchors
        run: python3 lab/verify_p8_cli_full_sources.py

      - name: Probar anclas P8 R14 / Test P8 R14 deny-only anchors
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_full_sources.py -v

      - name: Verificar matriz P8 R15 / Verify P8 R15 review gates
        run: python3 lab/verify_p8_cli_review_gates.py

      - name: Probar matriz P8 R15 / Test P8 R15 deny-only review gates
        run: python3 -m unittest discover -s lab/tests -p test_p8_cli_review_gates.py -v

      - name: Verificar modelo sintético SSH P8 R16 / Verify synthetic SSH model
        run: python3 lab/verify_p8_r16_ssh_precedence.py

      - name: Probar precedencia sintética P8 R16 / Test deny-only precedence
        run: python3 -m unittest discover -s lab/tests -p test_p8_r16_ssh_precedence.py -v

      - name: Auditar brechas de vinculacion material P8 R17 / Verify material closure gap
        run: python3 lab/verify_p8_r17_material_closure.py

      - name: Probar brechas de vinculacion P8 R17 / Test 29-profile material boundary
        run: python3 -m unittest discover -s lab/tests -p test_p8_r17_material_closure.py -v

      - name: Verificar interfaz ELF offline P8 R18 / Verify bounded ELF evidence interface
        run: python3 lab/verify_p8_r18_elf_metadata.py

      - name: Probar lector ELF P8 R18 / Test no-execution ELF metadata parser
        run: python3 -m unittest discover -s lab/tests -p test_p8_r18_elf_metadata.py -v

      - name: Verificar grafo ELF offline P8 R19 / Verify static candidate graph
        run: python3 lab/verify_p8_r19_graph.py

      - name: Probar grafo ELF P8 R19 / Test bounded deny-only graph
        run: python3 -m unittest discover -s lab/tests -p test_p8_r19_graph.py -v

      - name: Verificar candidatos privados Samba P8 R20 / Verify candidate contract
        run: python3 lab/verify_p8_r20_samba_candidate.py

      - name: Probar rutas privadas Samba P8 R20 / Test bounded deny-only candidates
        run: python3 -m unittest discover -s lab/tests -p test_p8_r20_samba_candidate.py -v

      - name: Probar contratos y transporte / Test contracts and transport
        run: PYTHONPATH=src python -m unittest discover -s tests/unit -p 'test_*.py' -v

  rust:
    name: Rust - compilación / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código / Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar Rust / Set up Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Preparar Python para protocolo / Set up protocol Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - name: Descargar dependencias Rust / Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Verificar compilación / Verify build
        run: python3 scripts/verificar_ci.py rust
      - name: Ejecutar pruebas Rust / Run Rust tests
        run: cargo test --workspace --all-targets --locked --offline
      - name: Probar transporte Python-Rust / Test Python-Rust transport
        run: python3 scripts/verificar_transporte.py

      - name: Contrastar protocolo Python-Rust / Compare Python-Rust protocol
        run: python3 scripts/verificar_protocolo.py

      - name: Verificar diario técnico / Verify technical journal
        run: python3 scripts/verificar_diario_tecnico.py

      - name: Verificar conciliación por socket / Verify socket reconciliation
        run: python3 scripts/verificar_conciliacion_transporte.py

      - name: Verificar magnitudes exactas / Verify exact magnitudes
        run: python3 scripts/verificar_magnitudes.py

      - name: Verificar política temporal / Verify temporal policy
        run: python3 scripts/verificar_tiempos.py

      - name: Verificar identidad del par / Verify peer identity
        run: python3 scripts/verificar_identidad_par.py

      - name: Comparar Python-Rust P8 R7 / Compare P8 R7 deny-only diagnostics
        run: |
          cargo build --locked --offline --package ardrec-executor --example p8_diagnostic_probe
          python3 scripts/verificar_p8_diagnostico.py --probe target/debug/examples/p8_diagnostic_probe

