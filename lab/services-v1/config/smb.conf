[global]
workgroup = ARDREC
server role = standalone server
security = user
map to guest = Never
server min protocol = SMB2_02
server max protocol = SMB3
server signing = mandatory
smb encrypt = desired
smb ports = 445
disable netbios = yes
interfaces = 127.0.0.1 10.203.32.2
bind interfaces only = yes
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes
log file = /var/log/samba/log.%m
max log size = 1024
[read-only]
path = /srv/ardrec/smb/read-only
read only = yes
guest ok = no
valid users = ardrec_smb
[temporary]
path = /srv/ardrec/smb/temporary
read only = no
guest ok = no
valid users = ardrec_smb
create mask = 0600
directory mask = 0700
smb encrypt = required
[restricted]
path = /srv/ardrec/smb/restricted
read only = yes
guest ok = no
valid users = root
