listen=YES
listen_ipv6=NO
listen_address=10.203.31.2
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=077
chroot_local_user=YES
allow_writeable_chroot=NO
local_root=/srv/ardrec/ftp
secure_chroot_dir=/var/lib/ardrec-vsftpd/empty
pam_service_name=vsftpd
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.user_list
pasv_enable=YES
pasv_min_port=50000
pasv_max_port=50009
pasv_address=10.203.31.2
port_enable=NO
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=NO
ssl_tlsv11=NO
ssl_tlsv12=YES
ssl_tlsv13=YES
require_ssl_reuse=YES
rsa_cert_file=/etc/ardrec/tls/ftp.crt
rsa_private_key_file=/etc/ardrec/tls/ftp.key
chmod_enable=NO
max_clients=4
max_per_ip=4
idle_session_timeout=120
data_connection_timeout=120
xferlog_enable=YES
