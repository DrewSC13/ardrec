
[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ardrec"
version = "0.1.0.dev0"
description = "Base académica de ARDREC / ARDREC academic baseline"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Private :: Do Not Upload",
]

[dependency-groups]
build = ["hatchling==1.29.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ardrec"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/ardrec",
    "/pyproject.toml",
    "/README.md",
    "/uv.lock",
]
